[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name = "shipassistant"
version = "2.0.0"
description = "Real-time Russian maritime voice command recognition — LoRA Wav2Vec2 on ONNX INT8"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "onnxruntime>=1.19",
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.13",
    "sounddevice>=0.5",
    "soxr>=0.3",
    "scikit-learn>=1.3",
    "joblib>=1.4",
    "RapidFuzz>=3.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

# ── Entry points ──────────────────────────────────────────────────────────────

[project.scripts]
ship-api      = "src.api:app"
ship-infer    = "src.inference:main"
ship-demo     = "scripts.main_demo_defense:main"

# ── Packages ──────────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "src*", "scripts*"]
exclude = ["experiments*", "tests*", "artifacts*", "logs*"]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require model files on disk",
]

# ── ruff (linter + formatter) ─────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["core", "src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests
"scripts/*" = ["T201"] # allow print in scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
